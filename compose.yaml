services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - meldingen:/data
    environment:
      DATABASE_URL: postgresql://storing:geheim123@db:5432/storingsmelder
    depends_on:
         db:
           condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: storing
      POSTGRES_PASSWORD: geheim123
      POSTGRES_DB: storingsmelder
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U storing -d storingsmelder"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  meldingen:
  pgdata: